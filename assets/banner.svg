<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
<title id="title">Dalton Pérez — Software, sistemas, automatización e inteligencia artificial</title>
<desc id="desc">Banner oscuro con tipografía clara, detalles geométricos turquesa y violeta, y el lema: tecnología para problemas reales.</desc>
